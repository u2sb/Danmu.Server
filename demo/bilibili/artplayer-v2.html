<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>demo</title>
  <style>
    .art-container {
      width: 800px;
      height: 450px;
    }
  </style>
</head>

<body>
  <h2>MessagePack 推荐</h2>
  <div id="art1" class="art-container"></div>

  <h2>JSON 不推荐</h2>
  <div id="art2" class="art-container"></div>

  <script type="module">
    import artplayer from "https://cdn.jsdelivr.net/npm/artplayer/+esm";
    import artdm from "https://cdn.jsdelivr.net/npm/artplayer-plugin-danmuku/+esm";
    import { getDanMuAsync } from "/assets/dm/artMsgpackDm.js";

    const Artplayer = artplayer.default;
    const artplayerPluginDanmuku = artdm.default;

    const art1 = new Artplayer({
      container: "#art1",
      url: "/assets/video/1214946209-1-192.mp4",
      fullscreen: true,
      fullscreenWeb: true,
      plugins: [
        artplayerPluginDanmuku({
          danmuku: () =>
            getDanMuAsync(
              "http://localhost:3567/api/art/bilibili/v2/BV1JP41167xK"
            ),
        }),
      ],
    });

    //不推荐
    const art2 = new Artplayer({
      container: "#art2",
      url: "/assets/video/1214946209-1-192.mp4",
      fullscreen: true,
      fullscreenWeb: true,
      plugins: [
        artplayerPluginDanmuku({
          danmuku: () =>
            fetch(
              "http://localhost:3567/api/art/bilibili/v2/BV1JP41167xK.json"
            ).then((res) => res.json()),
        }),
      ],
    });
  </script>
</body>
