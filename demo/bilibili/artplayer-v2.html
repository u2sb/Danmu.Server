<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>demo</title>
  <style>
    .art-container {
      width: 800px;
      height: 450px;
    }
  </style>
</head>

<body>
  <h2>MemoryPack 推荐</h2>
  <div id="art0" class="art-container"></div>

  <h2>MessagePack 推荐</h2>
  <div id="art1" class="art-container"></div>

  <h2>JSON 不推荐</h2>
  <div id="art2" class="art-container"></div>

  <script type="module">
    import artplayer from "https://cdn.jsdelivr.net/npm/artplayer/+esm";
    import artdm from "https://cdn.jsdelivr.net/npm/artplayer-plugin-danmuku/+esm";

    import { ArtPlayerDm } from "/assets/memorypack/ArtPlayerDm.js";
    import { decodeAsync } from "https://cdn.jsdelivr.net/npm/@msgpack/msgpack/+esm";

    const Artplayer = artplayer.default;
    const artplayerPluginDanmuku = artdm.default;

    const bin = await fetch(
      "http://localhost:3567/api/art/bilibili/v2/BV1zt411t79A",
      {
        headers: { "Content-Type": "application/x-memorypack" },
      }
    );
    const buffer = await bin.arrayBuffer();
    const d = ArtPlayerDm.deserializeArray(buffer);

    const art0 = new Artplayer({
      container: "#art0",
      url: "/assets/video/1214946209-1-192.mp4",
      plugins: [
        artplayerPluginDanmuku({
          danmuku: d,
        }),
      ],
    });

    const mb = await fetch(
      "http://localhost:3567/api/art/bilibili/v2/BV1zt411t79A",
      {
        headers: { "Content-Type": "application/x-msgpack" },
      }
    );
    const md = await decodeAsync(mb.body);
    const art1 = new Artplayer({
      container: "#art1",
      url: "/assets/video/1214946209-1-192.mp4",
      plugins: [
        artplayerPluginDanmuku({
          danmuku: md,
        }),
      ],
    });

    //不推荐
    const art2 = new Artplayer({
      container: "#art2",
      url: "/assets/video/1214946209-1-192.mp4",
      plugins: [
        artplayerPluginDanmuku({
          danmuku: () =>
            fetch(
              "http://localhost:3567/api/art/bilibili/v2/BV1zt411t79A.json"
            ).then((res) => res.json()),
        }),
      ],
    });
  </script>
</body>
