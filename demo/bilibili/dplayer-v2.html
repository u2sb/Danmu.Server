<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>demo</title>
  <style>
    .dp-container {
      width: 800px;
      height: 450px;
    }
  </style>
</head>

<body>
  <h2>protobuf 墙裂推荐</h2>
  <div id="dp0" class="dp-container"></div>

  <h2>json 不推荐</h2>
  <div id="dp1" class="dp-container"></div>

  <script type="module">
    import DPlayer from "https://cdn.jsdelivr.net/npm/dplayer/+esm";
    import { decodeAsync } from "https://cdn.jsdelivr.net/npm/@msgpack/msgpack/+esm";

    const mb = await fetch(
      "http://localhost:3567/api/dp/bilibili/v3/BV1JP41167xK",
      {
        headers: { "Content-Type": "application/x-msgpack" },
      }
    );
    const md = await decodeAsync(mb.body);

    const db0 = URL.createObjectURL(
      new Blob([JSON.stringify(md)], { type: "application/json" })
    );

    const dp0 = new DPlayer({
      container: document.getElementById("dp0"),
      video: {
        url: "/assets/video/1214946209-1-192.mp4",
      },
      danmaku: {
        id: "1",
        api: "http://localhost:3567/api/dp/bilibili/",
        addition: [db0],
      },
    });

    const dp1 = new DPlayer({
      container: document.getElementById("dp1"),
      video: {
        url: "/assets/video/1214946209-1-192.mp4",
      },
      danmaku: {
        id: "1",
        api: "http://localhost:3567/api/dp/bilibili/",
        addition: [
          "http://localhost:3567/api/dp/bilibili/v3/BV1JP41167xK.json",
        ],
      },
    });
  </script>
</body>
